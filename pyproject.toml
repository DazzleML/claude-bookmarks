# Tooling configuration for claude-bookmarks.
#
# The product is a Claude Code mod (TypeScript, in .claude-plugin/, hooks/ and
# types/), installed through a plugin marketplace -- it is NOT a Python
# package, so there is no [project] metadata here. This file configures the
# Python dev tooling only: the git-repokit-common subtree at
# scripts/repokit-common/ (version sync, CHANGELOG links, git hooks) and
# pytest, which the pre-push hook runs.

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
python_classes = "Test*"

[tool.repokit-common]
# Source of truth for version components (MAJOR/MINOR/PATCH/PHASE).
version-source = "version.py"
changelog = "CHANGELOG.md"
repo-url = "https://github.com/DazzleML/claude-bookmarks"
tag-prefix = "v"
# "human" tags (v0.1.0, v0.1.0-alpha) match the version Claude Code reads
# from .claude-plugin/plugin.json.
tag-format = "human"
private-patterns = ["private/", "local/", ".env"]

# Keep the plugin manifest's "version" in step with version.py.
# Inert until git-repokit-common ships extra-targets support (upstreaming in
# progress); until then tests/test_version.py guards the match.
[[tool.repokit-common.extra-targets]]
path = ".claude-plugin/plugin.json"
type = "json"
field = "version"
