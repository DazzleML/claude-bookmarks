version: 2
updates:
  # No pip ecosystem: the product is a Claude Code mod with no Python
  # dependencies (Python runs repo tooling only, configured in
  # .repokit-common.toml).

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "github-actions"
      - "dependencies"
    open-pull-requests-limit: 5
