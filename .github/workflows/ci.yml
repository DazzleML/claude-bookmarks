name: CI

# The product is a Claude Code mod (TypeScript under .claude-plugin/, hooks/
# and types/). This workflow runs the Python tooling checks only: version.py
# and the plugin manifest that must match it. The mod's own checks
# (`claude plugin validate --strict`, `tsc --strict`, core tests) run locally
# before pushing; moving them into CI needs the Claude Code CLI and TypeScript
# on the runner, which is still an open question.

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  tooling:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'

    - name: Install pytest
      run: python -m pip install --upgrade pip pytest

    - name: Plugin manifest is valid JSON
      run: python -c "import json; json.load(open('plugin/.claude-plugin/plugin.json', encoding='utf-8')); json.load(open('.claude-plugin/marketplace.json', encoding='utf-8'))"

    - name: Run tests
      run: python -m pytest tests/ -v
