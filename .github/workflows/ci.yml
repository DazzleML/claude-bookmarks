name: CI

# The product is a Claude Code mod (TypeScript under .claude-plugin/, hooks/
# and types/). This workflow runs the Python tooling checks (version.py and the
# plugin manifest that must match it) and the pure core's tests, which need only
# Node: it strips the types itself. `claude plugin validate` and `tsc` against
# the engine's types run locally before pushing; moving them into CI needs the
# Claude Code CLI on the runner, which is still an open question.

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  tooling:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'

    - name: Install pytest
      run: python -m pip install --upgrade pip pytest

    - name: Plugin manifest is valid JSON
      run: python -c "import json; json.load(open('plugin/.claude-plugin/plugin.json', encoding='utf-8')); json.load(open('.claude-plugin/marketplace.json', encoding='utf-8'))"

    - name: Run tests
      run: python -m pytest tests/ -v

    - name: Set up Node
      uses: actions/setup-node@v5
      with:
        node-version: '24'

    - name: Core tests
      run: node --test tests/core/*.test.ts
