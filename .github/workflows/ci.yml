name: CI

# The product is a Claude Code plugin (TypeScript under plugin/). Two jobs:
#
#   tooling -- the version tooling (version.py and the plugin manifest that
#              must match it), both manifests parse, and the pure core's
#              tests, which need only Node: it strips the types itself.
#   plugin  -- the Claude Code CLI installed from npm at the version the
#              plugin is verified against, then `claude plugin validate` on
#              the plugin (its manifest and hooks module as the engine reads
#              them) and on the repository (the marketplace file), and the
#              kit suite (`claude plugin test`), which runs headlessly with
#              no sign-in: measured 2026-10-22 against an empty config dir.
#
# Not here: the strict type check (`npx tsc -p plugin --noEmit`). It needs the
# engine's generated declarations (plugin/.claude-plugin/types/, gitignored),
# and the engine writes those only when it loads the plugin interactively,
# never from `validate` or `test` (measured 2026-10-22 on a copy without the
# folder). So the type check stays in the local pre-push hook, as #5 provides
# for anything the runner cannot run.

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  tooling:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'

    - name: Install pytest
      run: python -m pip install --upgrade pip pytest

    - name: Plugin manifest is valid JSON
      run: python -c "import json; json.load(open('plugin/.claude-plugin/plugin.json', encoding='utf-8')); json.load(open('.claude-plugin/marketplace.json', encoding='utf-8'))"

    - name: Run tests
      run: python -m pytest tests/ -v

    - name: Set up Node
      uses: actions/setup-node@v5
      with:
        node-version: '24'

    - name: Core tests
      run: node --test tests/core/*.test.ts

  plugin:
    runs-on: ubuntu-latest

    env:
      # The client the plugin is verified against; bump on purpose, never float.
      CLAUDE_CODE_VERSION: '2.1.308'

    steps:
    - uses: actions/checkout@v7

    - name: Set up Node
      uses: actions/setup-node@v5
      with:
        node-version: '24'

    # A config directory of the run's own, so nothing depends on the runner's home.
    # Set from a step: a job-level `env` cannot read the `runner` context (GitHub
    # rejected the file with "Unrecognized named-value: 'runner'", runs 39842630023
    # and 39887529592, so no job ran on either push since this job was added).
    - name: A config directory for this run
      run: |
        mkdir -p "$RUNNER_TEMP/claude-config"
        echo "CLAUDE_CONFIG_DIR=$RUNNER_TEMP/claude-config" >> "$GITHUB_ENV"

    - name: Install the Claude Code CLI
      run: npm install -g @anthropic-ai/claude-code@${{ env.CLAUDE_CODE_VERSION }}

    - name: Which build judged this run
      run: claude --version

    - name: Validate the plugin (manifest and hooks module, as the engine reads them)
      run: claude plugin validate ./plugin

    - name: Validate the repository as a marketplace
      run: claude plugin validate .

    - name: Kit suite
      run: claude plugin test plugin
